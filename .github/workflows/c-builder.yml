name: C CI

on:
  push:
    branches: [ "parallel_solver_constraint_pipeline","parallel_solver_constraint" ]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@v4
    - name: Setup C/C++ Compiler
      id: setup-compiler
      uses: rlalik/setup-cpp-compiler@master
      with:
        compiler: gcc-latest
    - name: install-openmpi
      shell: bash
      run: |
        sudo apt update
        sudo apt install openmpi-bin openmpi-doc libopenmpi-dev build-essential -y
    - name: configure
      shell: bash
      run: |
        ls -alp
        pwd
        chmod +x ./setup
        ./setup
        ls -alp
    - name: make
      run: make
    - name: Create Artifact
      uses: actions/upload-artifact@v4
      with:
        name: built_src_${{matrix.os}}
        path: build/
